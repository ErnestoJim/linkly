kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Sin esto, ingress-nginx podría acabar en un worker (que no tiene
    # los extraPortMappings) y `curl http://localhost` nunca llegaría a
    # nada. `make kind-ingress` usa este label como nodeSelector.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
  - role: worker
  - role: worker
