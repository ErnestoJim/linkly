# En dev/prod, .Values.secretEnv debería poblarse desde un Secret externo
# (p.ej. External Secrets Operator + AWS Secrets Manager para el
# DATABASE_URL de RDS), no quedarse en el values.yaml en texto plano.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkly.fullname" . }}-secret
  labels:
    {{- include "linkly.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
