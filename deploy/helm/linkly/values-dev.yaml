# Sobreescribe la imagen para el entorno dev. El tag lo actualiza
# automáticamente .github/workflows/release.yml en cada push a main
# (commit directo a este archivo) — Argo CD detecta el cambio y sincroniza.
api:
  image:
    repository: ghcr.io/ernestojim/linkly-api
    tag: 5bfce39
worker:
  image:
    repository: ghcr.io/ernestojim/linkly-worker
    tag: 5bfce39
# Postgres real (RDS) y cola real (SQS) — no viven en el cluster, así que
# postgresql.enabled / redis.enabled / elasticmq.enabled se quedan en
# `false` (el default de values.yaml).
#
# TODO(infra/modules/rds, infra/modules/sqs): estos son placeholders.
# Cuando esos módulos de Terraform existan, DATABASE_URL y SQS_QUEUE_URL
# deberían venir de un Secret externo (p.ej. External Secrets Operator
# leyendo AWS Secrets Manager con los outputs de Terraform), no en texto
# plano en este archivo.
ingress:
  host: dev.linkly.example.com
env:
  AWS_ENDPOINT_URL: ""
  BASE_URL: https://dev.linkly.example.com
secretEnv:
  DATABASE_URL: "postgresql+psycopg://REPLACE_ME@REPLACE_ME.rds.amazonaws.com:5432/linkly"
  REDIS_URL: "redis://REPLACE_ME.cache.amazonaws.com:6379/0"
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/REPLACE_ME/linkly-clicks"
