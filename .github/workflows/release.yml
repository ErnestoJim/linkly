name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/helm/linkly/values-dev.yaml"

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiqueta con el SHA corto del commit (p.ej. 3f2a1bc). Nunca `latest`:
      # así siempre se sabe exactamente qué versión corre en cada entorno.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/linkly-${{ matrix.service }}
          tags: type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Actualiza el tag de imagen en values-dev.yaml; Argo CD detecta el
  # cambio y sincroniza dev automáticamente (Fase 8).
  update-dev-values:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: install yq
        run: |
          curl -sSL -o ./yq https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          chmod +x ./yq

      - name: bump image tags in values-dev.yaml
        run: |
          ./yq -i '.api.image.tag = "${{ steps.sha.outputs.short }}"' deploy/helm/linkly/values-dev.yaml
          ./yq -i '.worker.image.tag = "${{ steps.sha.outputs.short }}"' deploy/helm/linkly/values-dev.yaml
          rm ./yq

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(deploy): bump dev image tags to ${{ steps.sha.outputs.short }} [skip ci]"
          file_pattern: deploy/helm/linkly/values-dev.yaml
