name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno"
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: "plan (seguro) o apply (crea/cambia infra de verdad, con coste)"
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      allowed_cidr:
        description: 'Tu IP pública para el endpoint de EKS, p.ej. "1.2.3.4/32" (déjalo vacío para no tocarlo)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # `terraform plan` en cada PR que toque infra/. Autenticado por OIDC
  # (ver infra/github-oidc) — nunca con access keys en secrets.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/envs/${{ matrix.env }}
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          set +e
          # -detailed-exitcode: 0 = sin cambios, 1 = error, 2 = hay cambios
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan_stdout.txt 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          cat plan_stdout.txt

          if [ "$exit_code" -eq 1 ]; then
            cp plan_stdout.txt plan.txt
          else
            terraform show -no-color tfplan > plan.txt
          fi

      - name: publica el plan como comentario en el PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            let plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');

            const maxLen = 60000;
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + '\n\n... (truncado)';
            }

            const status = exitCode === '0' ? 'sin cambios' : exitCode === '2' ? 'con cambios' : 'con error';
            const marker = `<!-- terraform-plan-${env} -->`;
            const body = `${marker}\n### Terraform plan — \`${env}\` (${status})\n\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: falla el job si terraform plan falló de verdad
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

  # El apply SIEMPRE es manual (workflow_dispatch) — así nunca se crea
  # infraestructura con coste por accidente en un push/PR normal.
  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform apply
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform init -input=false
          if [ -n "${{ inputs.allowed_cidr }}" ]; then
            terraform apply -input=false -auto-approve -var 'allowed_public_access_cidrs=["${{ inputs.allowed_cidr }}"]'
          else
            terraform apply -input=false -auto-approve
          fi
